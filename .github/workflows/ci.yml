name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx biome check .

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: cd server && bun install --frozen-lockfile
      - run: cd server && bunx tsc --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      # Root CLI unit suite (mocked transport) on bun, as the release job runs it.
      - run: bun run test
      # The same suite plus a v8 report; the config carries a ratchet threshold
      # (F38), so this step also guards against regressions. It needs node, set
      # up above: without node `bun run` falls back to bun, where v8 coverage
      # under-reports, varies between runs and would trip the ratchet.
      - run: bun run test:coverage
      # Server suite — includes the P1-1 CLI/local-server contract guard.
      - run: cd server && bun install --frozen-lockfile
      - run: cd server && bunx --bun vitest run

  # End-to-end smoke: boots the bundled server and drives the real CLI binary
  # against it over HTTP (P1-6 / F18). Needs BOTH the root deps (CLI) and the
  # server deps (graphql-yoga etc.), so install both before running.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: cd server && bun install --frozen-lockfile
      - run: bun run test:e2e
